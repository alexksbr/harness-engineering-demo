rules:
  - id: no-raw-sql-in-services
    languages:
      - typescript
    severity: ERROR
    message: |
      no-raw-sql-in-services: Raw SQL in service layer is forbidden.
      Why: services that hardcode table names and column names break silently when
      entities are renamed or migrations change the schema. The repository
      layer exists to absorb those changes.
      Fix:
        1. Identify the entity you need: see src/<module>/<module>.entity.ts.
        2. Add or extend a repository method in src/<module>/<module>.repository.ts.
           For non-trivial queries, use the typed QueryBuilder:
             this.em.createQueryBuilder(YourEntity, 'alias')
               .select(...)
               .leftJoin(...)
               .orderBy(...)
               .limit(limit);
        3. Inject the repository into your service and call the new method.
      Do not silence this rule with `// nosemgrep` or by moving the SQL elsewhere.
    paths:
      include:
        - /src/**/*.service.ts
    pattern-either:
      # em.getConnection() — flagged as the entry point itself.
      # No legitimate reason for a service to reach for the raw Connection.
      - patterns:
          - pattern: $EM.getConnection()
          - metavariable-regex:
              metavariable: $EM
              regex: ^(this\.)?em$
      # em.execute(...) with or without generic type arguments.
      - patterns:
          - pattern: $EM.execute(...)
          - metavariable-regex:
              metavariable: $EM
              regex: ^(this\.)?em$
      - patterns:
          - pattern: $EM.execute<$T>(...)
          - metavariable-regex:
              metavariable: $EM
              regex: ^(this\.)?em$
      # em.getKnex() — entry point to raw Knex queries.
      - patterns:
          - pattern: $EM.getKnex()
          - metavariable-regex:
              metavariable: $EM
              regex: ^(this\.)?em$
      - pattern: getKnex().raw(...)
